name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      - name: Build
        run: ./build.sh

      - name: Verify bundle
        run: |
          set -e
          test -x build/KeyboardLocker.app/Contents/MacOS/KeyboardLocker
          codesign --verify --strict build/KeyboardLocker.app
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" build/KeyboardLocker.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/KeyboardLocker.app/Contents/Info.plist

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/KeyboardLocker.app KeyboardLocker.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardLocker
          path: KeyboardLocker.zip
          retention-days: 14
